groups:
  - name: projet12
    rules:
      - alert: APIUnavailable
        expr: up{job="fastapi"} == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "API unavailable"}
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{handler="/predict"}[1m]))) > 0.5
        for: 1m
        labels: {severity: warning}
      - alert: DataDrift
        expr: data_drift_detected == 1
        for: 30s
        labels: {severity: warning}
      - alert: ServerErrors
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) > 0
        for: 30s
        labels: {severity: critical}
